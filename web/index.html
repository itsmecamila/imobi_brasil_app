<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Imóveis ImobiBrasil: lista, detalhe e edição.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ImobiBrasil">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ImobiBrasil</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    Web "native splash": the browser shows this logo instantly, while it
    downloads and starts Flutter. It matches the Flutter splash (same logo,
    size and position), and is removed on Flutter's first frame.
  -->
  <style>
    #web-splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #FFFFFF;
    }
    #web-splash img { width: min(320px, calc(100vw - 96px)); }
  </style>
  <div id="web-splash"><img src="splash-logo.svg" alt="ImobiBrasil"></div>
  <script>
    window.addEventListener('flutter-first-frame', () => {
      document.getElementById('web-splash')?.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
