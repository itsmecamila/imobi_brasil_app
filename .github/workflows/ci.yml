name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Formato, análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same version as the README, so "works on my machine" holds here too.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
          pub-cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
